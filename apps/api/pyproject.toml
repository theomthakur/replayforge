[project]
name = "replayforge-api"
version = "0.1.0"
description = "ReplayForge control plane: REST API, event stream, persistence, GitHub gate"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "replayforge",
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "SQLAlchemy==2.0.43",
  "sse-starlette==3.0.2",
  "reportlab==4.4.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replayforge_api"]
