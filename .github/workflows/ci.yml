name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: replayforge
      - uses: actions/checkout@v4
        with:
          repository: theomthakur/benchtrace
          ref: c50b962c620e89ed1d4dc4b04813e3b1ce0fe7e9
          path: benchtrace
      - uses: astral-sh/setup-uv@v6
      - name: Arrange workspace like the local layout (benchtrace two levels up)
        run: mkdir -p Nebius-NVIDIA-2026 && mv replayforge Nebius-NVIDIA-2026/
      - name: Install
        working-directory: Nebius-NVIDIA-2026/replayforge
        run: uv sync --python 3.12 --all-packages
      - name: Lint
        working-directory: Nebius-NVIDIA-2026/replayforge
        run: .venv/bin/ruff check apps packages && .venv/bin/ruff format --check apps packages
      - name: Tests (fixture providers only, no credits spent)
        working-directory: Nebius-NVIDIA-2026/replayforge
        run: .venv/bin/python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
