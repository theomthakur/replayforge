schema_version: "1.0"
suite:
  id: medicare-claims-real
  name: Medicare claims analytics · real repository
  description: A pinned, data-free workload from Om's public Medicare analytics pipeline.
  repository_fixture: fixtures/repos/medicare-claims
  source_repository_url: https://github.com/theomthakur/Medicare-Claims-Analytics-Lakehouse
  source_revision: 97fc7fd405f7adb6f60e7684b1c0be324b8dd161
  default_timeout_seconds: 90
  default_limits: {max_steps: 10, max_wall_seconds: 120}
tasks:
  - id: medicare-extract-npi-length
    category: refactor
    description: Name the NPI validation invariant.
    critical: true
    prompt: |
      Refactor src/quality_checks.py to define a module-level NPI_LENGTH constant and use it for
      both bounds of the NPI string-length validation. Preserve the value 10 and do not change
      any other validation rule or file.
    graders:
      - {type: command, command: "python -m py_compile src/quality_checks.py", expected_exit_code: 0}
      - {type: file_regex, path: src/quality_checks.py, pattern: "NPI_LENGTH\\s*=\\s*10"}
      - {type: file_regex, path: src/quality_checks.py, pattern: "str_length\\(NPI_LENGTH, NPI_LENGTH\\)"}
      - {type: forbidden_paths, paths: ["src/config.py", "README.md"]}
  - id: medicare-nav-page-size
    category: tool_use
    description: Report the bounded CMS ingestion page size.
    prompt: |
      Use search_text to find CMS_PAGE_SIZE. Do not change files. Call finish with exactly
      `page_size=<value>`.
    graders:
      - {type: tool_contract, required_tools: [search_text, finish], ordered: true}
      - {type: output_regex, pattern: "page_size=5000\\b"}
      - {type: forbidden_paths, paths: ["src/", "README.md"]}
