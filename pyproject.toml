[project]
name = "replayforge-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/engine", "apps/api"]

[tool.uv.sources]
replayforge = { workspace = true }
replayforge-api = { workspace = true }
benchtrace = { git = "https://github.com/theomthakur/benchtrace.git", rev = "7588dcaea1496c5725f0895f9a7a9df3bd1d300e" }

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
  "mypy==1.17.1",
  "types-PyYAML",
  "types-jsonschema",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Repository fixtures intentionally contain lint and correctness defects for agents to repair.
exclude = ["fixtures/repos/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter owns code line length; long user-facing strings are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/engine/tests", "apps/api/tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
